<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Archivos</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/workspace-nav.css"></head><body data-workspace-page="files"><main class="panel" style="max-width:900px;margin:32px auto"><div class="panel-title"><span>Archivos del proyecto</span></div><p class="muted">Carga segura mediante URLs temporales de Cloudflare R2.</p><input id="file" class="form-control" type="file" accept="image/*,application/pdf,.doc,.docx,.csv"><p id="status" class="muted">Selecciona un archivo para comenzar.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script>document.getElementById('file').onchange=async e=>{const f=e.target.files[0],id=new URLSearchParams(location.search).get('project'),s=document.getElementById('status');if(!f||!id)return;if(f.size>10*1024*1024){s.textContent='El archivo supera el límite de 10 MB.';return}try{const r=await Auth.api('/api/uploads/sign',{method:'POST',body:JSON.stringify({scope:'project',projectId:id,contentType:f.type,size:f.size})});await fetch(r.uploadUrl,{method:'PUT',headers:{'Content-Type':f.type},body:f});s.textContent='Archivo cargado correctamente.'}catch(err){s.textContent=err.message||'No se pudo cargar el archivo.'}};</script></body></html>
