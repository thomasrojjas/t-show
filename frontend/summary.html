<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Resumen</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/workspace-nav.css"><style>
body{position:relative;overflow-x:hidden;background:#000 radial-gradient(circle at 15% 10%,rgba(87,126,189,.16),transparent 34%),radial-gradient(circle at 90% 65%,rgba(61,111,102,.11),transparent 32%)}body:before,body:after{content:"";position:fixed;z-index:-1;width:42vw;height:42vw;border-radius:50%;filter:blur(70px);opacity:.18;pointer-events:none;animation:ambientFloat 18s ease-in-out infinite alternate}.summary-wrap{max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,72px) 0}.summary-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:1px;background:rgba(102,125,157,.35);border:1px solid rgba(102,125,157,.4);border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.38)}.summary-card{background:rgba(8,10,15,.82);backdrop-filter:blur(16px);padding:clamp(22px,4vw,48px);min-height:180px;animation:summaryIn .7s cubic-bezier(.22,1,.36,1) both}.summary-card:nth-child(2){animation-delay:.08s}.summary-card:nth-child(3){animation-delay:.16s}.summary-card h1{font-size:clamp(32px,6vw,76px);line-height:.95;letter-spacing:-.06em;margin:12px 0 20px}.summary-card h2{font-size:18px;margin:0 0 12px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);font-weight:800}.summary-link{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:#dceaff;color:#050609;text-decoration:none;font-weight:700;transition:transform .25s ease,background .25s ease,box-shadow .25s ease}.summary-link:hover,.summary-link:focus-visible{transform:translateY(-3px);background:#fff;box-shadow:0 12px 30px rgba(190,218,255,.2);outline:none}.project-list{display:grid;gap:0}.project-row{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid rgba(102,125,157,.25);transition:padding .25s ease,border-color .25s ease}.project-row:hover{padding-left:8px;border-color:#b8d7ff}.project-row a{color:var(--text-main);text-decoration:none}.muted{color:var(--text-muted)}@keyframes summaryIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes ambientFloat{from{transform:translate3d(-4%,0,0) scale(.95)}to{transform:translate3d(8%,6%,0) scale(1.08)}}@media(max-width:760px){.summary-grid{grid-template-columns:1fr;border-radius:14px}.summary-wrap{padding:24px 0}.summary-card{min-height:0}.summary-card h1{font-size:clamp(42px,14vw,64px)}}@media(prefers-reduced-motion:reduce){.summary-card,body:before,body:after{animation:none}.summary-link,.project-row{transition:none}}
</style></head><body data-workspace-page="summary"><main class="summary-wrap"><div class="summary-grid"><section class="summary-card"><span class="eyebrow">Centro de operación</span><h1 id="summaryTitle">Todo el show.<br>En su momento.</h1><p class="muted">Una vista clara del evento, sus próximos bloques y el estado de sincronización.</p><a class="summary-link" href="app.html?view=schedule">Abrir escaleta</a></section><section class="summary-card"><span class="eyebrow">Acceso rápido</span><h2>Modo en vivo</h2><p class="muted">Conduce el show con tiempos, estados y controles según tu rol.</p><a class="summary-link" href="live.html">Entrar al modo en vivo</a></section><section class="summary-card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Proyectos recientes</h2><span id="summarySync" class="muted">Cargando…</span></div><div id="summaryProjects" class="project-list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api-client.js"></script><script src="js/workspace-nav.js"></script><script>(async()=>{const box=document.getElementById('summaryProjects'),sync=document.getElementById('summarySync');try{const r=await ApiClient.getAllProjects();const items=Object.values(r.data||{});sync.textContent='Servidor sincronizado';box.innerHTML=items.length?items.map(p=>`<div class="project-row"><a href="app.html?view=schedule&project=${encodeURIComponent(p.id)}">${p.eventName||'Proyecto sin nombre'}</a><span class="muted">${p.updatedAt?new Date(p.updatedAt).toLocaleDateString('es-CL'):''}</span></div>`).join(''):'<p class="muted">No hay proyectos disponibles.</p>'}catch(e){sync.textContent='No se pudo sincronizar';box.innerHTML='<p class="muted">Revisa tu conexión e inténtalo nuevamente.</p>'}})();</script></body></html>
