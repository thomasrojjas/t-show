<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitación — T-Show</title><link rel="stylesheet" href="css/auth.css"><style>.invite-card{max-width:520px}.invite-event{margin:22px 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.invite-event strong{display:block;margin-top:8px;font-size:28px;letter-spacing:-.04em}.invite-event small{color:var(--muted)}.invite-actions{display:grid;gap:14px;margin-top:28px}.invite-actions a{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border:1px solid var(--ink);text-decoration:none;font-size:13px;font-weight:700}.invite-actions a:first-child{background:var(--ink);color:var(--black)}.invite-actions a:last-child{color:var(--ink)}.invite-message{margin-top:22px;padding:14px 0;border-top:1px solid var(--line);color:var(--muted)}.invite-message[data-status=error]{color:var(--danger);border-color:var(--danger)}</style></head>
<body><main class="auth-shell"><section class="auth-intro" aria-label="T-Show"><a class="auth-wordmark enter enter-1" href="/"><span>T</span>SHOW</a><div class="auth-intro-copy"><p class="auth-kicker enter enter-2">NUEVO ACCESO</p><h1 class="enter enter-3">Un equipo.<br>Un mismo<br>momento.</h1><p class="enter enter-4">Coordina cada evento con una sola referencia.</p></div><p class="auth-intro-footer enter enter-5">T-Show · BaseAndes Software</p></section><section class="auth-panel"><div class="auth-card invite-card"><p class="form-kicker">INVITACIÓN</p><div class="auth-brand"><h1>Te invitaron a colaborar.</h1></div><p class="auth-subtitle">Elige cómo quieres continuar. Tu contraseña siempre será privada.</p><div class="invite-event" id="inviteDetails" aria-live="polite"><span>Cargando invitación…</span></div><div class="invite-actions" id="inviteActions" hidden><a id="existingAccount" href="#">Ya tengo una cuenta</a><a id="newAccount" href="#">Crear mi cuenta</a></div><p id="inviteMessage" class="invite-message" role="alert"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/invitation-flow.js"></script></body></html>
