<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso de evento · T-Show</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="guest-block"><section class="op-panel"><span class="op-brand">T-SHOW</span><p class="op-kicker">Acceso de solo lectura</p><h1 id="title">Cargando evento…</h1><p id="meta" class="op-muted"></p><div id="blocks" class="op-list"></div><p id="status" class="error"></p></section></main><script>(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token){document.getElementById('status').textContent='Falta el token de acceso.';return}try{const r=await fetch(`/api/guest-passes/${encodeURIComponent(token)}`),b=await r.json();if(!r.ok)throw new Error(b.message||'Acceso no disponible.');document.getElementById('title').textContent=b.data.eventName;document.getElementById('meta').textContent=[b.data.eventDate,b.data.location].filter(Boolean).join(' · ');document.getElementById('blocks').innerHTML=(b.data.blocks||[]).map(x=>`<article class="op-list-item"><strong>${x.start||''} · ${x.title||'Bloque'}</strong><span class="op-muted">${x.duration?`${x.duration} min`:''}</span>${x.animator_script?`<p>${x.animator_script}</p>`:''}${x.notes?`<small>${x.notes}</small>`:''}</article>`).join('')||'<p class="op-muted">No hay bloques publicados.</p>'}catch(e){document.getElementById('status').textContent=e.message}})();</script></body></html>
