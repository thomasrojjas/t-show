<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin — T-Show</title><link rel="stylesheet" href="css/auth.css"><style>
.admin-shell{max-width:1440px}.admin-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.admin-kpi article{padding:16px;border:1px solid #303544;background:#111521}.admin-kpi strong{display:block;font-size:24px;margin-top:5px}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid #303544;text-align:left;vertical-align:top}.admin-table th{color:#aeb5c5;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.admin-table tr:hover{background:#151a27}.admin-table button{white-space:nowrap}.admin-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-detail .full{grid-column:1/-1}.admin-history{max-height:240px;overflow:auto;border:1px solid #303544;padding:8px}.admin-history article{padding:10px;border-bottom:1px solid #303544}.admin-history article:last-child{border-bottom:0}.admin-modules{display:flex;gap:8px;flex-wrap:wrap}.admin-modules label{display:flex;align-items:center;gap:5px}.admin-muted{color:#aeb5c5;font-size:12px}@media(max-width:800px){.admin-kpi{grid-template-columns:repeat(2,1fr)}.admin-table{display:block;overflow:auto;white-space:nowrap}.admin-detail{grid-template-columns:1fr}}
</style></head>
<body><main class="admin-shell"><header class="admin-header"><div><p class="admin-muted">CONTROL DE PLATAFORMA</p><h1>T-Show · Superadmin</h1></div><button class="btn btn-secondary" onclick="Auth.logout()">Cerrar sesión</button></header>
<section class="admin-kpi"><article><span class="admin-muted">Cuentas</span><strong id="accountCount">—</strong></article><article><span class="admin-muted">Eventos en uso</span><strong id="projectCount">—</strong></article><article><span class="admin-muted">Planes activos</span><strong id="planCount">—</strong></article><article><span class="admin-muted">Administrador</span><strong id="whoami">—</strong></article></section>
<section class="panel"><h2 class="panel-title">Planes comerciales</h2><div id="plans"></div><p id="message" class="auth-error" hidden></p></section>
<section class="panel"><div class="panel-title"><span>Cuentas y cupos</span><button id="accountRefresh" class="btn btn-secondary" type="button">Actualizar</button></div><div class="form-row"><input id="accountSearch" class="form-control" placeholder="Buscar por nombre, correo, RUT u organización" autocomplete="off"></div><div id="accounts"></div><p id="accountMessage" class="auth-error" hidden></p></section>
<dialog id="accountDialog"><form method="dialog" id="accountForm" class="auth-form"><h2 id="accountTitle">Detalle de cuenta</h2><p id="accountMeta" class="admin-muted"></p><div class="admin-detail"><label>Plan<select name="plan" class="form-control"><option value="free">Gratis</option><option value="pro">Pro</option><option value="max">Max</option><option value="enterprise">Empresa</option></select></label><label>Estado<select name="status" class="form-control"><option value="free">Gratis</option><option value="active">Activa</option><option value="read_only">Solo lectura</option><option value="expired">Vencida</option><option value="cancelled">Cancelada</option></select></label><label>Límite personalizado<input name="customLimit" class="form-control" type="number" min="1" placeholder="Sin excepción"></label><label>Inicio excepción<input name="startsAt" class="form-control" type="datetime-local"></label><label>Término excepción<input name="expiresAt" class="form-control" type="datetime-local"></label><label class="full">Motivo obligatorio<textarea name="reason" class="form-control" required minlength="2" maxlength="500" placeholder="Ej.: ampliación temporal por producción corporativa"></textarea></label></div><h3>Módulos especiales</h3><div id="accountModules" class="admin-modules"></div><h3>Historial administrativo</h3><div id="accountHistory" class="admin-history"></div><p id="detailMessage" class="admin-muted" role="status"></p><div class="shell-actions"><button class="btn btn-secondary" value="cancel">Cancelar</button><button class="btn btn-primary" id="accountSave" value="default">Guardar cambios</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/admin-app.js"></script></main></body></html>
