<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Superadmin — T-Show</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="admin-shell">
    <div class="admin-header">
        <h1>⏱ T-Show — Panel Superadmin</h1>
        <div>
            <span id="whoami" style="color:var(--text-muted); font-size:13px; margin-right:14px;"></span>
            <button class="btn btn-secondary" onclick="Auth.logout()">Cerrar sesión</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Crear cuenta de director</div>
        <form id="createUserForm">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="newUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nombre visible</label>
                    <input type="text" id="newDisplayName" class="form-control" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">PIN (4-6 dígitos)</label>
                    <input type="password" id="newPin" class="form-control" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email (opcional)</label>
                    <input type="email" id="newEmail" class="form-control">
                </div>
            </div>
            <div id="createUserMsg" class="auth-error" style="display:none;"></div>
            <button type="submit" class="btn btn-primary">+ Crear director</button>
        </form>
    </div>

    <div class="panel">
        <div class="panel-title">Cuentas del sistema</div>
        <table class="admin-table">
            <thead>
                <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Creado</th><th></th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
