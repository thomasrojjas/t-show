<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta — T-Show</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="auth-brand-icon">⏱</div><h1>T-Show</h1></div><p class="auth-subtitle">Crea tu cuenta</p><form id="registerForm" class="auth-form"><div class="form-row"><div class="form-group"><label class="form-label">Nombre</label><input id="firstName" class="form-control" required></div><div class="form-group"><label class="form-label">Apellido</label><input id="lastName" class="form-control" required></div></div><div class="form-group"><label class="form-label">RUT</label><input id="rut" class="form-control" placeholder="12345678-9" required></div><div class="form-group"><label class="form-label">Correo</label><input id="email" type="email" class="form-control" required></div><div class="form-group"><label class="form-label">Teléfono</label><input id="phone" type="tel" class="form-control" placeholder="+56912345678" required></div><div class="form-group"><label class="form-label">Contraseña</label><input id="password" type="password" minlength="8" class="form-control" required></div><div id="message" class="auth-error" style="display:none"></div><button class="btn btn-primary btn-block">Crear cuenta</button></form><p class="auth-subtitle"><a href="login.html">Ya tengo una cuenta</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message');try{const data=await Auth.register({firstName:firstName.value,lastName:lastName.value,rut:rut.value,email:email.value,password:password.value,phone:phone.value});message.textContent=data.session?'Cuenta creada.':'Revisa tu correo para confirmar tu cuenta; luego completa tu perfil al iniciar sesión.';message.style.display='block'}catch(err){message.textContent=err.message;message.style.display='block'}})</script></body></html>
