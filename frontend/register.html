<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta — T-Show</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-intro" aria-label="T-Show"><a class="auth-wordmark enter enter-1" href="/"><span>T</span>SHOW</a><div class="auth-intro-copy"><p class="auth-kicker enter enter-2">TU PRÓXIMA PRODUCCIÓN</p><h1 class="enter enter-3">Todo el show.<br>En su<br>momento.</h1><p class="enter enter-4">Empieza con una pauta clara y una operación preparada para cada cambio en vivo.</p></div><p class="auth-intro-footer enter enter-5">T-Show · BaseAndes Software</p></section><section class="auth-panel"><div class="auth-card"><p class="form-kicker enter enter-1">NUEVA CUENTA</p><div class="auth-brand enter enter-2"><h1>Crear cuenta</h1></div><p class="auth-subtitle enter enter-3">Configura tu acceso a T-Show.</p><form id="registerForm" class="auth-form enter enter-4"><div class="form-row"><div class="form-group"><label class="form-label" for="firstName">Nombre</label><input id="firstName" class="form-control" autocomplete="given-name" required></div><div class="form-group"><label class="form-label" for="lastName">Apellido</label><input id="lastName" class="form-control" autocomplete="family-name" required></div></div><div class="form-group"><label class="form-label" for="rut">RUT</label><input id="rut" class="form-control" placeholder="12345678-9" required></div><div class="form-group"><label class="form-label" for="email">Correo</label><input id="email" type="email" class="form-control" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="phone">Teléfono</label><input id="phone" type="tel" class="form-control" autocomplete="tel" placeholder="+56912345678" required></div><div class="form-group"><label class="form-label" for="password">Contraseña</label><input id="password" type="password" minlength="8" class="form-control" autocomplete="new-password" required></div><div id="message" class="auth-error" style="display:none"></div><button class="btn">Crear cuenta</button></form><div class="auth-links enter enter-5"><a href="login.html">Ya tengo una cuenta</a><a href="/">Volver a inicio</a></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message');try{const data=await Auth.register({firstName:document.getElementById('firstName').value,lastName:document.getElementById('lastName').value,rut:document.getElementById('rut').value,email:document.getElementById('email').value,password:document.getElementById('password').value,phone:document.getElementById('phone').value});message.textContent=data.session?'Cuenta creada.':'Revisa tu correo para confirmar tu cuenta; luego inicia sesión.';message.style.display='block'}catch(err){message.textContent=err.message;message.style.display='block'}})</script></body></html>
