<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>T-Show · Teleprompter</title><link rel="stylesheet" href="css/operations.css">
</head>
<body>
  <main class="op-shell teleprompter-shell">
    <nav class="op-nav" aria-label="Navegación principal">
      <a class="op-brand" href="/projects">T-SHOW</a><a href="/summary">Resumen</a><a href="/schedule">Escaleta</a>
      <a href="/teleprompter" aria-current="true">Teleprompter</a><a href="/" id="logout">Salir</a>
    </nav>
    <section class="op-panel teleprompter-panel" aria-live="polite">
      <header class="teleprompter-header"><div><span class="op-kicker">Guion profesional</span><h1 id="title" class="op-hero-title">Cargando evento…</h1><p id="meta" class="op-muted">Preparando el contenido.</p></div><div class="op-row"><button id="fullscreen">Pantalla completa</button><select id="mode" aria-label="Modo de lectura"><option value="all">Lectura</option><option value="script">Solo guion</option><option value="stage">Escenario</option><option value="mirror">Espejo</option></select></div></header>
      <div id="script" class="teleprompter-copy"><p class="op-muted">Cargando guion…</p></div>
      <footer class="teleprompter-controls" aria-label="Controles del teleprompter"><button id="toggle" class="primary">Iniciar desplazamiento</button><button id="reset">Reiniciar</button><label>Velocidad <input id="speed" type="range" min="1" max="10" value="3"></label><label>Tamaño <input id="size" type="range" min="1" max="6" value="3"></label></footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script>
  <script>
  (async()=>{const id=new URLSearchParams(location.search).get('project');if(!id){location.href='/projects';return;}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{await Auth.requireSession();const r=await Auth.api(`/api/projects/${encodeURIComponent(id)}/animator-script`),items=r.data||[];document.getElementById('title').textContent=items[0]?.project_name||'Guion del animador';document.getElementById('meta').textContent=`${items.length} bloque${items.length===1?'':'s'} con texto`;const root=document.getElementById('script');root.innerHTML=items.length?items.map(i=>`<article class="teleprompter-block"><div class="teleprompter-block-meta"><strong>${esc(i.start||'Sin hora')}</strong><span>${esc(i.title||'Bloque')}</span></div><p class="teleprompter-script">${esc(i.animator_script||'Este bloque no tiene texto de animación definido.')}</p><p class="teleprompter-notes">${esc(i.notes||'')}</p></article>`).join(''):'<p class="op-muted">Este evento todavía no tiene guion.</p>';let timer=null;const toggle=document.getElementById('toggle');toggle.onclick=()=>{if(timer){clearInterval(timer);timer=null;toggle.textContent='Iniciar desplazamiento';}else{timer=setInterval(()=>scrollBy(0,Number(document.getElementById('speed').value)),50);toggle.textContent='Pausar desplazamiento';}};document.getElementById('reset').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.getElementById('size').oninput=e=>root.style.setProperty('--script-scale',(0.7+Number(e.target.value)*.15).toFixed(2));document.getElementById('mode').onchange=e=>{root.dataset.mode=e.target.value;root.classList.toggle('is-mirror',e.target.value==='mirror');};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('logout').onclick=e=>{e.preventDefault();Auth.logout();};}catch(e){document.getElementById('title').textContent='No se pudo cargar el guion';document.getElementById('meta').textContent=e.message;}})();
  </script>
</body>
</html>
