<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>T-Show · Teleprompter</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="op-shell teleprompter-shell"><nav class="op-nav"><a class="op-brand" href="/projects">T-SHOW</a><a id="summary" href="/summary">Resumen</a><a id="schedule" href="/schedule">Escaleta</a><a href="/teleprompter" aria-current="true">Teleprompter</a></nav>
<section class="op-panel teleprompter-panel" id="panel"><header class="teleprompter-header"><div><span class="op-kicker">Guion profesional</span><h1 id="title">Preparando el guion…</h1><p id="meta" class="op-muted"></p></div><div class="op-row"><button id="fullscreen">Pantalla completa</button><select id="mode" aria-label="Modo"><option value="all">Lectura</option><option value="script">Solo guion</option><option value="stage">Escenario</option><option value="mirror">Espejo</option></select></div></header>
<div class="teleprompter-workspace"><aside id="chapters" class="teleprompter-chapters" aria-label="Bloques"></aside><div id="viewport" class="teleprompter-viewport"><article id="script" class="teleprompter-copy" aria-live="polite"></article></div></div>
<footer class="teleprompter-controls"><button id="previous">Anterior</button><button id="toggle" class="primary">Iniciar</button><button id="next">Siguiente</button><button id="reset">Reiniciar</button><label>Velocidad <input id="speed" type="range" min="5" max="120" value="35"></label><label>Tamaño <input id="size" type="range" min="1" max="6" value="3"></label></footer></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>
(async()=>{const q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const project=new URLSearchParams(location.search).get('project');if(!project){location.replace('/projects');return}q('summary').href=`/summary?project=${project}`;q('schedule').href=`/schedule?project=${project}`;let items=[],index=0,running=false,frame,last=0;const prefs=JSON.parse(localStorage.getItem('tshow-teleprompter-preferences')||'{}');['speed','size','mode'].forEach(key=>{if(prefs[key])q(key).value=prefs[key]});const save=()=>localStorage.setItem('tshow-teleprompter-preferences',JSON.stringify({speed:q('speed').value,size:q('size').value,mode:q('mode').value}));function render(){const item=items[index];q('chapters').innerHTML=items.map((entry,i)=>`<button data-index="${i}" aria-current="${i===index}"><small>${esc(entry.start||'Sin hora')}</small>${esc(entry.title||'Bloque')}</button>`).join('');q('chapters').querySelectorAll('button').forEach(button=>button.onclick=()=>select(Number(button.dataset.index)));q('script').innerHTML=item?`<div class="teleprompter-block-meta"><strong>${esc(item.start||'Sin hora')}</strong><span>${esc(item.title||'Bloque')}</span></div><p class="teleprompter-script">${esc(item.animator_script||'Este bloque no tiene texto de animación definido.')}</p><p class="teleprompter-notes">${esc(item.notes||'')}</p>`:'<p class="op-muted">Este evento todavía no tiene guion.</p>';q('script').style.setProperty('--script-scale',(0.7+Number(q('size').value)*.15).toFixed(2));q('script').dataset.mode=q('mode').value;q('script').classList.toggle('is-mirror',q('mode').value==='mirror');q('viewport').scrollTop=0}function select(next){index=Math.max(0,Math.min(items.length-1,next));render()}function tick(now){if(!running)return;if(last){q('viewport').scrollTop+=(now-last)*Number(q('speed').value)/1000}last=now;frame=requestAnimationFrame(tick)}function pause(){running=false;cancelAnimationFrame(frame);last=0;q('toggle').textContent='Iniciar'}try{await Auth.requireSession();const result=await Auth.api(`/api/projects/${project}/animator-script`);items=result.data||[];q('title').textContent=items[0]?.project_name||'Guion del evento';q('meta').textContent=`${items.length} bloque${items.length===1?'':'s'} disponible${items.length===1?'':'s'}`;render();q('toggle').onclick=()=>{if(running){pause()}else{running=true;q('toggle').textContent='Pausar';frame=requestAnimationFrame(tick)}};q('previous').onclick=()=>select(index-1);q('next').onclick=()=>select(index+1);q('reset').onclick=()=>q('viewport').scrollTo({top:0,behavior:'smooth'});q('size').oninput=()=>{save();render()};q('speed').oninput=save;q('mode').onchange=()=>{save();render()};q('fullscreen').onclick=()=>q('panel').requestFullscreen?.();document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()})}catch(e){q('title').textContent='No pudimos cargar el guion';q('meta').textContent=e.message}})();
</script></body></html>
