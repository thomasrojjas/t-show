<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Teleprompter</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="op-shell"><nav class="op-nav"><a class="op-brand" href="/projects">T-SHOW</a><a href="/summary">Resumen</a><a href="/schedule">Escaleta</a><a href="/teleprompter" aria-current="true">Teleprompter</a><a href="/">Salir</a></nav><section class="op-panel op-live"><div><span class="op-kicker">Guion profesional</span><h1 id="title" class="op-hero-title">Selecciona un evento</h1><p id="meta" class="op-muted"></p><div id="script" style="font-size:clamp(1.5rem,4vw,3.5rem);line-height:1.35;max-width:900px;margin:28px auto">El guion del animador aparecerá aquí.</div><div class="op-row" style="justify-content:center"><button id="toggle" class="primary">Iniciar desplazamiento</button><button id="reset">Reiniciar</button><label>Velocidad <input id="speed" type="range" min="1" max="10" value="3"></label></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('project');if(!id)return;try{const r=await Auth.api(`/api/projects/${id}/animator-script`),items=r.data||[];document.getElementById('title').textContent=items[0]?.title||'Guion del animador';document.getElementById('meta').textContent=`${items.length} bloques disponibles`;document.getElementById('script').innerHTML=items.map(i=>`<section class="op-list-item"><strong>${i.start||''} · ${i.title||'Bloque'}</strong><p>${i.animator_script||'Este bloque no tiene texto de animación definido.'}</p></section>`).join('');let timer=null;document.getElementById('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('toggle').textContent='Iniciar desplazamiento'}else{timer=setInterval(()=>scrollBy(0,Number(document.getElementById('speed').value)),50);document.getElementById('toggle').textContent='Pausar'}};document.getElementById('reset').onclick=()=>scrollTo({top:0,behavior:'smooth'})}catch(e){document.getElementById('script').textContent=e.message}})();</script></body></html>
