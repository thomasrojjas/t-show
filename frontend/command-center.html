<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>T-Show · Centro de mando</title><link rel="stylesheet" href="css/operations.css"></head>
<body><main class="op-shell"><nav class="op-nav" aria-label="Navegación"><a class="op-brand" href="/projects">T-SHOW</a><a href="/command-center" aria-current="true">Centro de mando</a><a href="/projects">Proyectos</a><a href="/incidents">Incidentes</a><a href="/teleprompter">Teleprompter</a></nav>
<section class="op-panel op-hero"><span class="op-kicker">Operación multi-evento</span><h1>Todo el territorio.<br>Una sola lectura.</h1><p class="op-muted">Coordina eventos, recintos, documentación e incidentes desde una vista común.</p></section>
<div class="op-toolbar"><label>Organización<select id="org"><option value="">Cargando…</option></select></label><label>Buscar evento<input id="search" type="search" placeholder="Nombre o ubicación"></label></div>
<section class="op-grid" id="metrics" aria-busy="true"></section>
<section class="op-layout"><article class="op-panel"><div class="op-section-head"><div><span class="op-kicker">Agenda</span><h2>Próximos eventos</h2></div><span id="count" class="op-muted"></span></div><div id="events" class="op-list"><p class="op-muted">Cargando eventos…</p></div></article><aside class="op-panel"><span class="op-kicker">Atención</span><h2>Conflictos y alertas</h2><div id="conflicts" class="op-list"><p class="op-muted">Analizando…</p></div></aside></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>
(async()=>{const q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];try{await Auth.requireSession();const orgs=await Auth.api('/api/organizations');q('org').innerHTML=(orgs.data||[]).map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')||'<option value="">Sin organizaciones</option>';const render=()=>{const term=q('search').value.toLowerCase();const rows=all.filter(e=>`${e.event_name} ${e.payload?.location||''}`.toLowerCase().includes(term));q('count').textContent=`${rows.length} evento${rows.length===1?'':'s'}`;q('events').innerHTML=rows.map(e=>`<a class="op-list-item op-event" href="/summary?project=${encodeURIComponent(e.id)}"><strong>${esc(e.event_name)}</strong><span>${esc(e.payload?.eventDate||'Fecha por definir')} · ${esc(e.payload?.location||'Ubicación por definir')}</span><b>Abrir →</b></a>`).join('')||'<p class="op-empty">No hay eventos que coincidan.</p>'};async function load(){const id=q('org').value;if(!id)return;const [events,metrics,conflicts]=await Promise.all([Auth.api(`/api/organizations/${id}/events`),Auth.api(`/api/organizations/${id}/metrics`),Auth.api(`/api/organizations/${id}/conflicts`)]);all=events.data||[];render();const m=metrics.data||{};q('metrics').innerHTML=[['Total',m.total],['Preparación',m.preparation],['Aprobados',m.approved],['En ejecución',m.running],['Incidentes críticos',m.criticalIncidents],['Documentos pendientes',m.pendingDocuments]].map(([label,value])=>`<article class="op-panel op-stat"><span>${label}</span><strong>${Number(value||0)}</strong></article>`).join('');q('metrics').setAttribute('aria-busy','false');q('conflicts').innerHTML=(conflicts.data||[]).map(c=>`<article class="op-list-item"><strong>${esc(c.message)}</strong><span class="op-status ${c.severity==='warning'?'warning':''}">${esc(c.code)}</span></article>`).join('')||'<p class="op-empty success">No detectamos conflictos operativos.</p>'}q('org').onchange=load;q('search').oninput=render;await load()}catch(e){document.querySelector('.op-shell').insertAdjacentHTML('beforeend',`<p class="error" role="alert">${esc(e.message)}</p>`)}})();
</script></body></html>
