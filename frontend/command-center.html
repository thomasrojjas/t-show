<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Centro de mando</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="op-shell"><nav class="op-nav"><a class="op-brand" href="/projects">T-SHOW</a><a href="/command-center" aria-current="true">Centro de mando</a><a href="/projects">Proyectos</a><a href="/incidents">Incidentes</a><a href="/teleprompter">Teleprompter</a><span style="margin-left:auto"></span><a href="/">Salir</a></nav><section class="op-panel"><span class="op-kicker">Operación multi-evento</span><h1>Centro de mando.</h1><p class="op-muted">Una lectura común para cada evento, recinto y equipo.</p></section><section class="op-grid" id="metrics" style="margin-top:18px"></section><section class="op-panel" style="margin-top:18px"><div class="op-row" style="justify-content:space-between"><h2>Eventos de la organización</h2><select id="org"><option>Cargando organizaciones…</option></select></div><div id="events" class="op-list"><p class="op-muted">Cargando…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>(async()=>{try{const orgs=await Auth.api('/api/organizations');const select=document.getElementById('org');select.innerHTML=(orgs.data||[]).map(o=>`<option value="${o.id}">${o.name}</option>`).join('')||'<option>Sin organizaciones</option>';async function load(){const id=select.value;if(!id)return;const [events,metrics]=await Promise.all([Auth.api(`/api/organizations/${id}/events`),Auth.api(`/api/organizations/${id}/metrics`)]);document.getElementById('events').innerHTML=(events.data||[]).map(e=>`<a class="op-list-item" href="/summary?project=${encodeURIComponent(e.id)}"><strong>${e.event_name}</strong><span class="op-muted">${e.payload?.eventDate||'Fecha por definir'} · ${e.payload?.location||'Ubicación por definir'}</span></a>`).join('')||'<p class="op-muted">No hay eventos asociados.</p>';const m=metrics.data||{};document.getElementById('metrics').innerHTML=[['Preparación',m.preparation||0],['Aprobados',m.approved||0],['En ejecución',m.running||0],['Incidentes',m.incidents||0],['Documentos pendientes',m.pendingDocuments||0]].map(x=>`<article class="op-panel" style="grid-column:span 2"><span class="op-kicker">${x[0]}</span><div class="op-metric">${x[1]}</div></article>`).join('')}select.onchange=load;await load()}catch(e){document.querySelector('.op-shell').insertAdjacentHTML('beforeend',`<p class="error">${e.message}</p>`)}})();</script></body></html>
