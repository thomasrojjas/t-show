<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Incidentes</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="op-shell"><nav class="op-nav"><a class="op-brand" href="/projects">T-SHOW</a><a href="/command-center">Centro de mando</a><a href="/incidents" aria-current="true">Incidentes</a><a href="/teleprompter">Teleprompter</a></nav><section class="op-panel"><span class="op-kicker">Seguridad operativa</span><h1>Incidentes.</h1><p class="op-muted">Registra, asigna y cierra cada situación con trazabilidad.</p></section><section class="op-panel" style="margin-top:18px"><form id="form" class="op-form"><input id="project" placeholder="ID del evento" required><input id="title" placeholder="Título del incidente" required><textarea id="description" placeholder="Descripción"></textarea><div class="op-row"><select id="type"><option value="technical">Falla técnica</option><option value="security">Seguridad</option><option value="medical">Emergencia médica</option><option value="weather">Clima</option><option value="other">Otro</option></select><select id="priority"><option value="low">Baja</option><option value="medium" selected>Media</option><option value="high">Alta</option><option value="critical">Crítica</option></select><button class="primary">Registrar</button></div><p id="status" class="op-muted"></p></form></section><section class="op-panel" style="margin-top:18px"><div class="op-row"><input id="loadProject" placeholder="ID del evento para consultar"><button id="load">Cargar incidentes</button></div><div id="list" class="op-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>(()=>{const q=id=>document.getElementById(id);q('form').onsubmit=async e=>{e.preventDefault();try{const id=q('project').value.trim();await Auth.api(`/api/projects/${id}/incidents`,{method:'POST',body:JSON.stringify({title:q('title').value,description:q('description').value,type:q('type').value,priority:q('priority').value})});q('status').textContent='Incidente registrado.';q('status').className='success';}catch(err){q('status').textContent=err.message;q('status').className='error'}};q('load').onclick=async()=>{try{const data=await Auth.api(`/api/projects/${q('loadProject').value.trim()}/incidents`);q('list').innerHTML=(data.data||[]).map(i=>`<article class="op-list-item"><div class="op-row"><strong>${i.title}</strong><span class="op-status ${i.priority==='critical'?'error':i.priority==='high'?'warning':'success'}">${i.priority}</span></div><p class="op-muted">${i.description||'Sin descripción'} · ${i.status}</p></article>`).join('')||'<p class="op-muted">Sin incidentes.</p>'}catch(err){q('list').innerHTML=`<p class="error">${err.message}</p>`}}})();</script></body></html>
