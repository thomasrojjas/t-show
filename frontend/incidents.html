<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>T-Show · Incidentes</title><link rel="stylesheet" href="css/operations.css"></head><body><main class="op-shell"><nav class="op-nav"><a class="op-brand" href="/projects">T-SHOW</a><a id="back" href="/summary">Resumen</a><a href="/command-center">Centro de mando</a><a href="/incidents" aria-current="true">Incidentes</a></nav>
<section class="op-panel op-hero"><span class="op-kicker">Respuesta operativa</span><h1>Detectar. Asignar.<br>Resolver.</h1><p class="op-muted" id="projectName">Cargando el evento…</p></section>
<section class="op-layout"><article class="op-panel"><span class="op-kicker">Nuevo registro</span><h2>Registrar incidente</h2><form id="form" class="op-form"><label>Título<input id="title" maxlength="180" required></label><label>Descripción<textarea id="description" maxlength="4000"></textarea></label><div class="op-row"><label>Tipo<select id="type"><option value="technical">Falla técnica</option><option value="security">Seguridad</option><option value="medical">Emergencia médica</option><option value="electrical">Electricidad</option><option value="weather">Clima</option><option value="other">Otro</option></select></label><label>Prioridad<select id="priority"><option value="low">Baja</option><option value="medium" selected>Media</option><option value="high">Alta</option><option value="critical">Crítica</option></select></label></div><button class="primary" id="submit">Registrar incidente</button><p id="status" role="status"></p></form></article>
<article class="op-panel"><div class="op-section-head"><div><span class="op-kicker">Seguimiento</span><h2>Incidentes del evento</h2></div><select id="filter" aria-label="Filtrar estado"><option value="">Todos</option><option value="open">Abiertos</option><option value="attending">En atención</option><option value="resolved">Resueltos</option><option value="closed">Cerrados</option></select></div><div id="list" class="op-list" aria-live="polite"></div></article></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>
(async()=>{const q=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const project=new URLSearchParams(location.search).get('project');if(!project){location.replace('/projects');return}q('back').href=`/summary?project=${encodeURIComponent(project)}`;let incidents=[];const render=()=>{const state=q('filter').value;const rows=incidents.filter(i=>!state||i.status===state);q('list').innerHTML=rows.map(i=>`<article class="op-list-item op-incident"><div><span class="op-status priority-${esc(i.priority)}">${esc(i.priority)}</span><strong>${esc(i.title)}</strong></div><p>${esc(i.description||'Sin descripción')}</p><small>${esc(i.status)} · ${new Date(i.created_at).toLocaleString('es-CL')}</small>${i.status!=='closed'?`<button data-close="${i.id}">Cerrar incidente</button>`:''}</article>`).join('')||'<p class="op-empty">Este evento no tiene incidentes registrados.</p>';document.querySelectorAll('[data-close]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{await Auth.api(`/api/projects/${project}/incidents/${button.dataset.close}/close`,{method:'POST'});await load()}catch(e){q('status').textContent=e.message;q('status').className='error'}})};async function load(){const result=await Auth.api(`/api/projects/${project}/incidents`);incidents=result.data||[];render()}try{await Auth.requireSession();const projectData=await Auth.api(`/api/projects/${project}`);q('projectName').textContent=projectData.data?.event_name||'Evento activo';await load();q('filter').onchange=render;q('form').onsubmit=async e=>{e.preventDefault();q('submit').disabled=true;q('status').textContent='Guardando…';try{await Auth.api(`/api/projects/${project}/incidents`,{method:'POST',body:JSON.stringify({title:q('title').value,description:q('description').value,type:q('type').value,priority:q('priority').value})});e.target.reset();q('status').textContent='Incidente registrado y compartido con el equipo.';q('status').className='success';await load()}catch(err){q('status').textContent=err.message;q('status').className='error'}finally{q('submit').disabled=false}}}catch(e){q('list').innerHTML=`<p class="error">${esc(e.message)}</p>`}})();
</script></body></html>
