<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes — T-Show</title><link rel="stylesheet" href="css/auth.css"><style>body{background:#03040a}.billing{max-width:1000px;margin:0 auto;padding:48px 24px}.billing-head{margin-bottom:40px}.billing-head h1{font-size:clamp(42px,7vw,84px);line-height:.9;letter-spacing:-.06em}.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.plan{padding:28px;border:1px solid #2d3342;background:rgba(8,12,24,.8)}.plan h2{margin:0 0 8px}.plan p{color:#a8adbb;min-height:42px}.plan-price{font-size:30px;margin:24px 0;color:#b8d7ff}.plan button{width:100%;min-height:48px;margin-top:12px}.billing-status{margin-top:24px;padding:14px 0;border-top:1px solid #2d3342}.billing-status[data-status=success]{color:#80e2a7}.billing-status[data-status=warning]{color:#ffd166}.billing-status[data-status=error]{color:#ff8e8e}@media(max-width:700px){.plans{grid-template-columns:1fr}.billing{padding:32px 18px}}</style></head><body><main class="billing"><a class="auth-wordmark" href="/">T<span>SHOW</span></a><header class="billing-head"><p class="form-kicker">PLANES</p><h1>Elige el ritmo<br>de tu operación.</h1><p class="auth-subtitle">Planes mensuales y anuales para equipos que coordinan eventos y espectáculos.</p></header><section class="plans" id="plans"><p>Cargando planes…</p></section><p id="billingStatus" class="billing-status" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>(async function(){const plans=document.getElementById('plans'),status=document.getElementById('billingStatus');try{await Auth.requireSession();const result=await Auth.api('/api/billing/plans');const list=result.data||[];if(!list.length){plans.innerHTML='<p class="auth-subtitle">Los planes estarán disponibles próximamente.</p>';return}plans.innerHTML=list.map(p=>{const amount=Number(p.amount_clp||0);return '<article class="plan"><p class="form-kicker">'+(p.interval==='year'?'ANUAL':'MENSUAL')+'</p><h2>'+p.name+'</h2><p>'+(Array.isArray(p.benefits)&&p.benefits.length?p.benefits.join(' · '):'Acceso completo a tu espacio de operación.')+'</p><div class="plan-price">'+(amount>0?'$'+amount.toLocaleString('es-CL')+' CLP':'Próximamente')+'</div><button class="btn" '+(amount>0?'data-plan="'+p.id+'"':'disabled')+'>'+(amount>0?'Continuar al pago':'Próximamente')+'</button></article>'}).join('');plans.addEventListener('click',async e=>{const b=e.target.closest('[data-plan]');if(!b)return;b.disabled=true;status.dataset.status='warning';status.textContent='Preparando pago seguro…';try{const r=await Auth.api('/api/mercadopago/checkout-pro',{method:'POST',body:JSON.stringify({planId:b.dataset.plan})});location.href=r.initPoint}catch(err){status.dataset.status='error';status.textContent=err.message;b.disabled=false}})}catch(err){status.dataset.status='error';status.textContent=err.message}})();</script></body></html>
