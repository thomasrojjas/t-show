<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión — T-Show</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-intro" aria-label="T-Show"><a class="auth-wordmark enter enter-1" href="/"><span>T</span>SHOW</a><div class="auth-intro-copy"><p class="auth-kicker enter enter-2">OPERACIÓN EN VIVO</p><h1 class="enter enter-3">Vuelve al<br>momento<br>correcto.</h1><p class="enter enter-4">Tu timing, tu escaleta y el estado del show, en la misma referencia.</p></div><p class="auth-intro-footer enter enter-5">T-Show · BaseAndes Software</p></section><section class="auth-panel"><div class="auth-card"><p class="form-kicker enter enter-1">ACCESO</p><div class="auth-brand enter enter-2"><h1>Iniciar sesión</h1></div><p class="auth-subtitle enter enter-3">Ingresa con tu correo y contraseña.</p><form id="loginForm" class="auth-form enter enter-4" autocomplete="on"><div class="form-group"><label class="form-label" for="email">Correo</label><input type="email" id="email" class="form-control" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="password">Contraseña</label><input type="password" id="password" class="form-control" minlength="8" autocomplete="current-password" required></div><div id="loginError" class="auth-error" style="display:none"></div><button type="submit" class="btn" id="loginBtn">Ingresar</button></form><div class="auth-links enter enter-5"><a id="registerLink" href="register.html">Crear cuenta</a><a href="#" id="resetLink">¿Olvidaste tu contraseña?</a></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>
const form=document.getElementById('loginForm'),errorBox=document.getElementById('loginError'),btn=document.getElementById('loginBtn'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');
const params=new URLSearchParams(location.search),invite=params.get('invite');
if(invite)document.getElementById('registerLink').href=`register.html?invite=${encodeURIComponent(invite)}`;
async function finishAccess(){if(invite){try{const accepted=await Auth.acceptInvitation(invite);location.href=`/summary?project=${encodeURIComponent(accepted.projectId)}`;return}catch(error){errorBox.textContent=error.message||'La invitación no es válida o ya expiró.';errorBox.style.display='block';return}}const redirect=params.get('redirect');location.href=redirect?decodeURIComponent(redirect):'/projects'}
Auth.currentUser().then(user=>{if(user)finishAccess()});
form.addEventListener('submit',async event=>{event.preventDefault();errorBox.style.display='none';btn.disabled=true;btn.textContent='Ingresando…';try{await Auth.login(emailInput.value.trim(),passwordInput.value);await finishAccess()}catch(error){errorBox.textContent=error.message||'Correo o contraseña incorrectos';errorBox.style.display='block';btn.disabled=false;btn.textContent='Ingresar'}});
document.getElementById('resetLink').addEventListener('click',async event=>{event.preventDefault();if(!emailInput.value.trim()){errorBox.textContent='Ingresa tu correo para recuperar la contraseña.';errorBox.style.display='block';return}try{await Auth.forgotPassword(emailInput.value.trim());errorBox.textContent='Revisa tu correo para continuar.';errorBox.style.display='block'}catch(error){errorBox.textContent=error.message;errorBox.style.display='block'}});
</script></body></html>
