<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — T-Show</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-icon">⏱</div>
            <h1>T-Show</h1>
        </div>
        <p class="auth-subtitle">Ingresa con tu correo y contraseña</p>

        <form id="loginForm" class="auth-form" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="email">Correo</label>
                <input type="email" id="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" minlength="8" autocomplete="current-password" required>
            </div>
            <div id="loginError" class="auth-error" style="display:none;"></div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Ingresar</button>
        </form>
    </div>
</div>

    <p class="auth-subtitle"><a href="register.html">Crear cuenta</a> · <a href="#" id="resetLink">¿Olvidaste tu contraseña?</a></p>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    // Si ya hay sesión, saltar directo a la app.
    Auth.currentUser().then(user => { if (user) window.location.href = 'app.html'; });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Ingresando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            await Auth.login(email, password);
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            window.location.href = redirect ? decodeURIComponent(redirect) : 'app.html';
        } catch (err) {
            errorBox.textContent = err.message || 'Correo o contraseña incorrectos';
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Ingresar';
        }
    });
    document.getElementById('resetLink').addEventListener('click', async e => { e.preventDefault(); const email = document.getElementById('email').value.trim(); if (!email) return errorBox.textContent = 'Ingresa tu correo para recuperar la contraseña.', errorBox.style.display = 'block'; try { await Auth.forgotPassword(email); errorBox.textContent = 'Revisa tu correo para continuar.'; errorBox.style.display = 'block'; } catch (err) { errorBox.textContent = err.message; errorBox.style.display = 'block'; } });
</script>
</body>
</html>
