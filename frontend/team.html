<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-Show · Equipo</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/workspace-nav.css"></head><body data-workspace-page="team"><main class="panel" style="max-width:900px;margin:32px auto"><div class="panel-title"><span>Equipo del proyecto</span><button class="btn btn-primary" id="invite">Invitar persona</button></div><p id="status" style="color:var(--text-muted)">Selecciona un proyecto desde la escaleta para administrar sus accesos.</p><div id="members"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/workspace-nav.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('project'),box=document.getElementById('members'),status=document.getElementById('status');if(!id){status.textContent='Falta el proyecto activo. Ábrelo desde Resumen o Escaleta.';return}async function load(){try{const r=await Auth.api(`/api/projects/${encodeURIComponent(id)}/members`);box.innerHTML=(r.data||[]).map(m=>`<div class="project-chip" style="margin:8px 0"><span>${m.profiles?.first_name||''} ${m.profiles?.last_name||m.profiles?.email||''}</span><span class="muted">${m.role==='editor'?'Director':'Observador'}</span></div>`).join('')||'<p class="muted">Sin colaboradores todavía.</p>';status.textContent='Accesos del proyecto';}catch(e){status.textContent=e.message}}document.getElementById('invite').onclick=async()=>{const email=prompt('Correo de la persona a invitar');if(!email)return;const role=confirm('¿Permisos de edición?')?'editor':'viewer';try{await Auth.api(`/api/projects/${encodeURIComponent(id)}/invitations`,{method:'POST',body:JSON.stringify({email,role})});await load();}catch(e){status.textContent=e.message}};load()})();</script></body></html>
